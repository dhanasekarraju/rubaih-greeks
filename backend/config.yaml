exchange:
  name: delta
  # India production API. Global: https://api.delta.exchange
  base_url: "https://api.india.delta.exchange"
  taker_fee: 0.0005
  rest_timeout_sec: 20

trading:
  mode: options_cycle
  capital_inr: 1000
  # Convert INR seed → USDT quote when Delta wallet is USD/USDT
  usdt_inr: 87
  # Capital survival: small premium per trade (was 55–60%)
  margin_use_frac: 0.20
  margin_use_max_frac: 0.25
  # Hard cap so one trade cannot empty a tiny USDT book
  max_premium_budget_usdt: 2.0
  underlyings:
    - BTC
    - ETH
  # Buy calls/puts only — never sell premium in v1
  allow_sell_premium: false
  min_entry_interval_sec: 120
  strategy:
    entry_cooldown_sec: 300
    momentum_lookback: 20
    entry_move_pct: 0.003
    # Skip 0–1D lottery and slow far theta
    min_dte_days: 2
    max_dte_days: 5
    # Near-ATM only
    atm_band_pct: 0.015
    # Tighter liquidity
    max_spread_pct: 0.05
    min_mark_premium: 0.5
    # Directional delta band (abs for puts)
    min_delta: 0.30
    max_delta: 0.55
    target_delta: 0.40
    # Premium % exits (option price, not underlying)
    take_profit_premium_pct: 0.35
    stop_loss_premium_pct: 0.18
    max_loss_frac: 0.10
    trail_arm_r: 0.7
    trail_giveback_r: 0.4
    trail_giveback_of_peak: 0.25
    # Enforce 4h time stop (was 0 / ignored)
    max_hold_sec: 14400

risk:
  kill_switch_on_drawdown: true
  max_drawdown_pct: 0.15
  max_daily_loss_frac: 0.25
  emergency_flatten: true
  rate_limit_orders_per_sec: 3

api:
  host: "0.0.0.0"
  port: 8000

logging:
  level: "INFO"
  file: "logs/rubaih_greeks.log"
