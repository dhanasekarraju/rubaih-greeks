worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=20r/s;

    server {
        listen 80;
        listen [::]:80;
        server_name YOUR_VPS_IP_OR_DOMAIN;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 1M;

        # Docker embedded DNS — re-resolve so recreate of greeks_api does not stick a dead IP (502)
        resolver 127.0.0.11 ipv6=off valid=10s;

        location = /api/health {
            set $api_upstream greeks_api:8000;
            proxy_pass http://$api_upstream/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $api_upstream greeks_api:8000;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /ws {
            limit_req zone=ws_limit burst=30 nodelay;
            set $api_upstream greeks_api:8000;
            proxy_pass http://$api_upstream/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location / {
            return 200 'Rubaih Greeks API — use /api/health\n';
            add_header Content-Type text/plain;
        }
    }
}
