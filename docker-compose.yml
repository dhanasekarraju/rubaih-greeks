services:
  postgres:
    image: postgres:15-alpine
    container_name: greeks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greeks
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: rubaih_greeks
    volumes:
      - greeks_pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "127.0.0.1:5438:5432"
    networks:
      - greeks_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greeks -d rubaih_greeks"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: greeks_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --bind 0.0.0.0 --protected-mode no
    volumes:
      - greeks_redisdata:/data
    ports:
      - "127.0.0.1:6388:6379"
    networks:
      - greeks_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  greeks_engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greeks_engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rubaih_greeks
      DB_USER: greeks
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - greeks_logs:/app/logs
    networks:
      - greeks_net
    command: python -u greeks_engine.py

  greeks_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greeks_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: rubaih_greeks
      DB_USER: greeks
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8018:8000"
    volumes:
      - ./backend:/app
      - greeks_logs:/app/logs
    networks:
      - greeks_net
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: greeks_nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      greeks_api:
        condition: service_healthy
    networks:
      - greeks_net

volumes:
  greeks_pgdata:
  greeks_redisdata:
  greeks_logs:

networks:
  greeks_net:
    driver: bridge
